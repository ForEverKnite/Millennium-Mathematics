name: Preserve and sync OpenAI mathematics

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openai-math-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Snapshot, inspect, and synchronize permitted source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mathematics-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/openai/math.git
          git fetch upstream main
          git checkout main
          git pull --ff-only origin main
          latest="$(git rev-parse upstream/main)"
          state='.github/openai-math-upstream-sha'
          if [[ -f "$state" ]]; then
            previous="$(cat "$state")"
            git cat-file -e "${previous}^{commit}"
          else
            # One-time migration from the original upstream-merge mechanism.
            previous="$(git merge-base HEAD "$latest")"
          fi
          git merge-base --is-ancestor "$previous" "$latest" || {
            echo 'STOP: upstream history changed; manual review required.' >&2
            exit 1
          }
          if [[ "$previous" == "$latest" ]]; then
            echo 'Already examined this upstream commit.'
            exit 0
          fi
          echo 'Upstream changes in GitHub-controlled metadata (REVIEW ONLY):'
          git diff --name-status --no-renames "$previous" "$latest" -- .github/
          echo 'Permitted-content changes under review:'
          git diff --name-status --no-renames "$previous" "$latest" -- . ':(exclude).github/**'
          if [[ -n "$(git diff --name-only --no-renames --diff-filter=D "$previous" "$latest" -- . ':(exclude).github/**')" ]]; then
            echo 'STOP: upstream deletes or renames existing content. Manual review required.' >&2
            exit 1
          fi
          tag="snapshot-$(date -u +%Y%m%dT%H%M%SZ)"
          git tag -a "$tag" -m "Archive before examining upstream $latest"
          git push origin "refs/tags/$tag"
          # Apply only content changes; do not import upstream commit ancestry.
          git diff --binary --no-ext-diff --no-renames "$previous" "$latest" -- . ':(exclude).github/**' | git apply --index --3way
          printf '%s\n' "$latest" > "$state"
          git add -- "$state"
          # Ensure the final commit changes no GitHub-controlled workflow files.
          if [[ -n "$(git diff --cached --name-only -- .github/workflows/)" ]]; then
            echo 'STOP: workflow change unexpectedly staged.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "Archive permitted OpenAI math updates through ${latest:0:12}"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(cat "$state")" = "$latest"
          git ls-remote --exit-code origin "refs/tags/$tag"
          echo "SUCCESS: archive main advanced and snapshot $tag exists."
